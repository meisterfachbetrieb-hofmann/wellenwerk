# Wellenwerk Wächter — läuft stündlich, meldet Zustandswechsel per Telegram.
# Ablageort im Repo: .github/workflows/wellenwerk-alert.yml
name: Wellenwerk Alert

on:
  schedule:
    - cron: "7 * * * *"   # stündlich, Minute 7 (volle Stunden sind bei GitHub überlastet)
  workflow_dispatch: {}    # zusätzlich manuell startbar (Reiter "Actions" → "Run workflow")

permissions:
  contents: write          # nötig, um state.json zurück ins Repo zu schreiben

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Wächter ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wellenwerk_alert.py

      - name: Zustand sichern
        run: |
          git config user.name "wellenwerk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Kein neuer Zustand — nichts zu sichern."
            exit 0
          fi
          git commit -m "Zustand aktualisiert"
          git pull --rebase origin main || true
          git push
